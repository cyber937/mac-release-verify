# Copy this into .github/workflows/ in your own app's repository.
#
# It checks the artifact you are about to publish and fails the job before
# anything reaches a user. Findings appear as annotations on the run.
name: verify release

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ... however your pipeline produces the artifact ...

      - uses: cyber937/mac-release-verify@v1
        with:
          artifact: build/MyApp-${{ github.ref_name }}.dmg
          appcast: build/appcast.xml
          dsym: build/MyApp.xcarchive
          previous-build: ${{ vars.LAST_SHIPPED_BUILD }}
